# This is the neoforge.mods.toml file of the Arcana mod.
#
# Arcana is a member of the mod family: it needs Genesis for the material template and for the
# magic of the world.

license="${mod_license}"

issueTrackerURL="https://github.com/KevinT742/Arcana/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Arcana makes the free floating magic of Genesis usable.

It adds an arcane altar, which draws the magic of the ground into a bottle or pours it back in,
and an arcane lens, which shows how much magic there is under your feet.

Arcana does not invent a magic of its own. The magic of every region comes from Genesis, and
because the magic of a world is stored, what the altar does to a region stays done: the ground
of a region that was drained stays poor until somebody fills it again.
'''

authors="Kevin742"

# A dependency on NeoForge itself.
[[dependencies.${mod_id}]] #mandatory
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version}" #mandatory
    ordering="NONE"
    side="BOTH"

# A dependency on Minecraft itself.
[[dependencies.${mod_id}]] #mandatory
    modId="minecraft" #mandatory
    type="required" #mandatory
    versionRange="${minecraft_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

# Genesis is the foundation of the family.
[[dependencies.${mod_id}]] #mandatory
    modId="genesis" #mandatory
    type="required" #mandatory
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
