// ============================================================================
// Arcana —— 模组家族成员 "arcana"
// ============================================================================
// Arcana 把 Genesis 的"游离魔力"变成玩家能用得上的东西：
// 一座奥术祭坛（抽取 / 灌注地面的魔力）和一枚奥术透镜（查看脚下的浓度）。
//
// 它不做自己的魔法：魔力来自 Genesis，Arcana 只给玩家操作它的办法。
// 而因为魔力的世界是**存下来的**，祭坛对一片地做过的事会一直算数。
//
// 共享属性（minecraft_version / neo_version ...）来自根目录 gradle.properties；
// 本模组专属属性（mod_id / mod_name / mod_version ...）来自本目录 gradle.properties。
// Java 工具链与源码编码等家族约定由根工程的 subprojects 块统一施加。
// ============================================================================

plugins {
    // 插件版本在根工程统一声明，此处不再写版本号
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // 若 maven.neoforged.net 不可达（国内常见），在这里加入 NeoForge 制品镜像：
    // maven { url = 'https://你的镜像/maven.neoforged.net/releases/' }
}

base {
    archivesName = mod_id
}

// 引用了 base 的 sourceSet，所以必须等 base 评估完。
evaluationDependsOn(":base")

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Genesis 是另一个模组，它也要作为模组被加载。
        "genesis" {
            sourceSet(project(':base').sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ★ 这一行就是"家族"二字的全部含义：
    //   兄弟模组只靠这一行就拿到了 Genesis 的 api 契约与 core 算法。
    implementation project(':base')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// The development helpers are compiled with the mod so that they can use the Minecraft classes,
// but they are kept out of the published jar.
tasks.named('jar', Jar).configure {
    exclude 'arcana/dev/**'
}

// Runs the Arcana self test. It checks the rules of the rituals, which know nothing about the game.
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Arcana self test.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'arcana.dev.ArcanaSelfTest'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
